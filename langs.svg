  />
  <text x="40" y="50" fill="#ffffff" font-size="24" font-weight="bold" font-family="Roboto, sans-serif">
    Lenguajes más usados
  </text>
  
      <text x="40" y="80" fill="#ffffff" font-size="18" font-family="Roboto, sans-serif">
